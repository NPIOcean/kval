name: Run Tests for Kval (Ubuntu) (py3.11 only)

on:   
  workflow_dispatch:
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.11",]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # Use the latest version of actions/checkout

    - name: Set up Python
      uses: actions/setup-python@v4  # Use the latest version of actions/setup-python
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restore RBR test files (downloaded from Zenodo, cached between runs)
      id: rbr-cache
      uses: actions/cache/restore@v4
      with:
        path: tests/test_data/rbr_files
        key: rbr-test-files-v1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install -e '.[dev]'  # This installs the optional dev dependencies, including pytest

    - name: Run tests
      run: |
        pytest
      env:
        CI: true

    - name: Save RBR test files to the cache (only when all three were downloaded)
      if: >-
        always() && steps.rbr-cache.outputs.cache-hit != 'true' &&
        hashFiles('tests/test_data/rbr_files/conc_chl_par_example.rsk') != '' &&
        hashFiles('tests/test_data/rbr_files/conc_example.rsk') != '' &&
        hashFiles('tests/test_data/rbr_files/solo_example.rsk') != ''
      uses: actions/cache/save@v4
      with:
        path: tests/test_data/rbr_files
        key: rbr-test-files-v1
